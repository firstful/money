# NetworkPolicy — money (INGRESS-ONLY default-deny)
#
# Self-contained-ish app: parses uploads + renders Sankey locally, PLUS makes
# outbound HTTPS calls to Plaid (sandbox.plaid.com / production.plaid.com) for
# the transaction-sync + correlation pilot, and writes the Plaid Secret via the
# in-cluster kube-apiserver.
#
#  * INGRESS-ONLY default-deny (policyTypes: [Ingress]) — NOT [Ingress, Egress].
#    Per homelab network-policy-isolation gotcha #5, on this k3s (embedded
#    kube-router) any EGREESS rule intermittently drops NEW outbound
#    connections, so apps that make outbound calls use ingress-only netpols
#    (pattern: llm, cf-manager). Egress is ungoverned in the LAN-trust domain;
#    DNS + kube-apiserver calls therefore work without explicit egress rules.
#  * ingress to money: only Traefik (kube-system) — money.ffilt.us on :8000.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: money
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# Allow Traefik -> money (needed for money.ffilt.us).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-ingress
  namespace: money
spec:
  podSelector:
    matchLabels:
      app: money
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8000
