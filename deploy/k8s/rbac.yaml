apiVersion: v1
kind: ServiceAccount
metadata:
  name: money
  namespace: money
---
# The app writes its own Plaid Secret via the in-cluster API (self-service UI).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: money-secrets
  namespace: money
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: money-secrets
  namespace: money
subjects:
  - kind: ServiceAccount
    name: money
    namespace: money
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: money-secrets
